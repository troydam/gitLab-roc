# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - itc-deploy-phase-1
  - itc-deploy-phase-2
  - itc-preprod-phase-1
  - itc-preprod-phase-2

variables:
  # AWX runner image. In an IL5/DoD environment, replace this with your internal
  # Iron Bank / approved registry awx-ee image (browse: https://harbor.health.mil/harbor/projects).
  AWX_IMAGE: "harbor.health.mil/base-images/python:latest"
  # Certs lane: AWX job template bound to playbooks/itc-deploy-sailpoint-certs.yml
  JOB_TEMPLATE_NAME: "264"
  # Config-import lane: AWX job template bound to playbooks/itc-import-sailpoint-xml.yml
  XML_IMPORT_JOB_TEMPLATE_NAME: "314"
  # Fetch full git history so any git-diff-based step (change detection) is reliable.
  GIT_DEPTH: "0"
  # Truststore reconcile controls, passed to the playbook as extra_vars.
  # DEFAULT = plan/dry-run on every phase: the pipeline shows the import/replace/delete
  # diff and changes nothing. To enforce, set the GitLab CI/CD variable RECONCILE_APPLY=true
  # (and RECONCILE_FORCE=true to allow a large prune, e.g. the first run that removes the
  # JDK default roots). Review the dry-run plan before ever setting these.
  # NOTE: AWX job template 264 must have "Prompt on launch" enabled for variables,
  # otherwise --extra_vars is ignored.
  RECONCILE_APPLY: "false"
  RECONCILE_FORCE: "false"
  # GOVERNANCE: RECONCILE_FORCE bypasses the engine's max_deletes safety rail. Define it as a
  # PROTECTED, manually-set GitLab CI/CD variable (not group-wide), so a large prune of the
  # truststore can't be enabled silently for every phase. Treat enabling it as a change-controlled action.
  #
  # CONFIG_APPLY (config-import lane) is deliberately NOT defined here. The xml-* jobs
  # default it via ${CONFIG_APPLY:-false}, so every import runs as a build-and-validate
  # preview (SSB build in place, nothing written to the IdentityIQ DB). When a real import
  # is intended, define CONFIG_APPLY as a PROTECTED, manually-set GitLab CI/CD variable.
  # NEVER hardcode CONFIG_APPLY "true" in this file.
  # Tomcat update lane: AWX job template bound to playbooks/itc-patch-tomcat.yml
  TOMCAT_UPDATE_JOB_TEMPLATE_NAME: "325"
  # Tomcat update controls. DEFAULT = plan/dry-run. 
  # To enforce, define TOMCAT_APPLY=true as a PROTECTED, manually-set GitLab
  # CI/CD variable (same discipline as RECONCILE_APPLY / CONFIG_APPLY; never
  # hardcode it here).
  # NOTE: AWX job template 325 must have "Prompt on launch" enabled for
  # variables, otherwise --extra_vars (including tomcat_apply) is ignored.
  TOMCAT_APPLY: "true"
  # XML IMPORT Variable for taking it out of what-if mode
  CONFIG_APPLY: "true"
# ---------------------------------------------------------
# Shared building blocks (hidden jobs; the leading '.' means
# GitLab never runs these directly)
# ---------------------------------------------------------

# Every deploy job runs on the AWX image with awxkit installed.
# All eight jobs pull this in via `extends: .awx-runner`, so the
# install procedure is defined ONCE, here.
.awx-runner:
  image: $AWX_IMAGE
  before_script:
    # 1. Install git if it is missing (required for the .xml-changed diff script)
    - |
      if ! command -v git >/dev/null 2>&1; then
        echo "Git not found. Installing..."
        if command -v dnf >/dev/null 2>&1; then dnf install -y git;
        elif command -v microdnf >/dev/null 2>&1; then microdnf install -y git;
        elif command -v yum >/dev/null 2>&1; then yum install -y git;
        elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y git;
        elif command -v apk >/dev/null 2>&1; then apk add --no-cache git;
        else 
          echo "ERROR: No recognized package manager found to install git!"
          exit 1
        fi
      fi
    # 2. Check if python3-pip is available... (keep your existing pip logic here)
    - |
      if command -v pip3 >/dev/null 2>&1; then
        pip3 install awxkit
      elif python3 -m pip --version >/dev/null 2>&1; then
        python3 -m pip install awxkit
      elif python -m pip --version >/dev/null 2>&1; then
        python -m pip install awxkit
      else
        echo "Neither pip nor python could be invoked. Trying package manager..."
        if command -v apk >/dev/null 2>&1; then apk add --no-cache python3-pip && pip3 install awxkit; fi
      fi
# Computes CHANGED: a JSON list of the .xml files under config/
# changed in this push. Every XML wave pulls this in as its first
# script step via `!reference [.xml-changed, script]`.
.xml-changed:
  script:
    - |
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git rev-parse "$CI_COMMIT_BEFORE_SHA" >/dev/null 2>&1; then
        DIFF_BASE="$CI_COMMIT_BEFORE_SHA"
      else
        DIFF_BASE="HEAD~1"
      fi
      CHANGED=$(git diff --name-only "$DIFF_BASE" "$CI_COMMIT_SHA" -- 'config' | python3 -c "import sys, json; print(json.dumps([l.strip() for l in sys.stdin if l.strip().endswith('.xml')]))")
      echo "XML files changed in this commit: $CHANGED"
# ---------------------------------------------------------
# Security Scan Overrides
# ---------------------------------------------------------
# use '_' underscore to match self-hosted template definitions
secret_detection:
  stage: test
  artifacts:
    paths:
      - gl-secret-detection-report.json

sast:
  stage: test

# =========================================================
# CERT RECONCILE WAVES (AWX job template 264)
# ---------------------------------------------------------
# These jobs run only when a cert-lane input actually changed
# (files/*.cer, the reconcile engine, or the certs playbook) -
# a config/**/*.xml-only commit no longer triggers the certs
# lane. Dev canary auto, everything after a manual gate.
# Plan/dry-run unless RECONCILE_APPLY.
# =========================================================

# ---------------------------------------------------------
# Phase 1: Deploy to the Canary/Phase 1 Dev Servers
# ---------------------------------------------------------
dev-phase-1:
  stage: itc-deploy-phase-1
  extends: .awx-runner
  script:
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$JOB_TEMPLATE_NAME"
      --limit "itc-dev-phase1"
      --extra_vars "{\"reconcile_apply\": \"${RECONCILE_APPLY:-false}\", \"reconcile_force\": \"${RECONCILE_FORCE:-false}\"}"
      --monitor
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "Java/lib/security/Certs/cacerts/*.cer"
        - "reconcile-truststore.ps1"
        - "playbooks/itc-deploy-sailpoint-certs.yml"

# ---------------------------------------------------------
# Phase 2: Deploy to the Remaining Dev Servers
# ---------------------------------------------------------
dev-phase-2:
  stage: itc-deploy-phase-2
  extends: .awx-runner
  script:
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$JOB_TEMPLATE_NAME"
      --limit "itc-dev-phase2"
      --extra_vars "{\"reconcile_apply\": \"${RECONCILE_APPLY:-false}\", \"reconcile_force\": \"${RECONCILE_FORCE:-false}\"}"
      --monitor
  dependencies:
    - dev-phase-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "Java/lib/security/Certs/cacerts/*.cer"
        - "reconcile-truststore.ps1"
        - "playbooks/itc-deploy-sailpoint-certs.yml"
      when: manual

# ---------------------------------------------------------
# PreProd Phase 1: Deploy to the Canary/Phase 1 preprod Servers
# ---------------------------------------------------------
preprod-phase-1:
  stage: itc-preprod-phase-1
  extends: .awx-runner
  script:
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$JOB_TEMPLATE_NAME"
      --limit "itc-preprod-phase1"
      --extra_vars "{\"reconcile_apply\": \"${RECONCILE_APPLY:-false}\", \"reconcile_force\": \"${RECONCILE_FORCE:-false}\"}"
      --monitor
  dependencies:
    - dev-phase-2
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "Java/lib/security/Certs/cacerts/*.cer"
        - "reconcile-truststore.ps1"
        - "playbooks/itc-deploy-sailpoint-certs.yml"
      when: manual

# ---------------------------------------------------------
# PreProd Phase 2: Deploy to the Remaining preprod Servers
# ---------------------------------------------------------
preprod-phase-2:
  stage: itc-preprod-phase-2
  extends: .awx-runner
  script:
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$JOB_TEMPLATE_NAME"
      --limit "itc-preprod-phase2"
      --extra_vars "{\"reconcile_apply\": \"${RECONCILE_APPLY:-false}\", \"reconcile_force\": \"${RECONCILE_FORCE:-false}\"}"
      --monitor
  dependencies:
    - preprod-phase-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "Java/lib/security/Certs/cacerts/*.cer"
        - "reconcile-truststore.ps1"
        - "playbooks/itc-deploy-sailpoint-certs.yml"
      when: manual

# =========================================================
# CONFIG IMPORT WAVES (AWX job template 314)
# ---------------------------------------------------------
# Single-box, incremental config promotion. Each wave runs
# playbooks/itc-import-sailpoint-xml.yml on that wave's IIQ
# servers: it builds the SSB project IN PLACE at D:\identityiq
# (SPTARGET-selected) and, on apply, imports the custom config
# objects into the live IdentityIQ DB via the SSB `import-custom`
# target. No build host, no artifact transfer, no war redeploy.
#
# They only wake up when an object XML under config/ actually
# changed (the `changes:` rule).
#
# SAFE BY DEFAULT: build-and-validate PREVIEW only (SSB build in
# place, nothing written to the IdentityIQ DB) unless a PROTECTED
# CI/CD variable CONFIG_APPLY is set to "true". Do NOT hardcode
# CONFIG_APPLY=true here.
# =========================================================

# ---------------------------------------------------------
# Config Phase 1: Import to the Canary/Phase 1 Dev Servers
# ---------------------------------------------------------
xml-dev-phase-1:
  stage: itc-deploy-phase-1
  extends: .awx-runner
  script:
    - !reference [.xml-changed, script]
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$XML_IMPORT_JOB_TEMPLATE_NAME"
      --limit "itc-dev-phase1"
      --extra_vars "{\"xml_files\": $CHANGED, \"ssb_target\": \"dev\", \"iiq_host\": \"itc-dev-phase1\", \"config_apply\": \"${CONFIG_APPLY:-false}\"}"
      --monitor
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "config/**/*.xml"

# ---------------------------------------------------------
# Config Phase 2: Import to the Remaining Dev Servers
# ---------------------------------------------------------
xml-dev-phase-2:
  stage: itc-deploy-phase-2
  extends: .awx-runner
  script:
    - !reference [.xml-changed, script]
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$XML_IMPORT_JOB_TEMPLATE_NAME"
      --limit "itc-dev-phase2"
      --extra_vars "{\"xml_files\": $CHANGED, \"ssb_target\": \"dev\", \"iiq_host\": \"itc-dev-phase2\", \"config_apply\": \"${CONFIG_APPLY:-false}\"}"
      --monitor
  dependencies:
    - xml-dev-phase-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "config/**/*.xml"
      when: manual

# ---------------------------------------------------------
# Config PreProd Phase 1: Import to the Canary/Phase 1 preprod Servers
# ---------------------------------------------------------
xml-preprod-phase-1:
  stage: itc-preprod-phase-1
  extends: .awx-runner
  script:
    - !reference [.xml-changed, script]
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$XML_IMPORT_JOB_TEMPLATE_NAME"
      --limit "itc-preprod-phase1"
      --extra_vars "{\"xml_files\": $CHANGED, \"ssb_target\": \"pp\", \"iiq_host\": \"itc-preprod-phase1\", \"config_apply\": \"${CONFIG_APPLY:-false}\"}"
      --monitor
  dependencies:
    - xml-dev-phase-2
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "config/**/*.xml"
      when: manual

# ---------------------------------------------------------
# Config PreProd Phase 2: Import to the Remaining preprod Servers
# ---------------------------------------------------------
xml-preprod-phase-2:
  stage: itc-preprod-phase-2
  extends: .awx-runner
  script:
    - !reference [.xml-changed, script]
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$XML_IMPORT_JOB_TEMPLATE_NAME"
      --limit "itc-preprod-phase2"
      --extra_vars "{\"xml_files\": $CHANGED, \"ssb_target\": \"pp\", \"iiq_host\": \"itc-preprod-phase2\", \"config_apply\": \"${CONFIG_APPLY:-false}\"}"
      --monitor
  dependencies:
    - xml-preprod-phase-1
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "config/**/*.xml"
      when: manual

# =========================================================
# TOMCAT UPDATE WAVES (AWX job template - 325)
# ---------------------------------------------------------
# PLAN BY DEFAULT: the playbook compares the patch source against
# each target and reports drift without touching the service.
# Apply (stop / backup / copy / restart, rollback on failure) runs
# only when the protected CI/CD variable TOMCAT_APPLY=true.
# Wakes up when patches/tomcat/ or the playbook changes.
# =========================================================

# ---------------------------------------------------------
# Tomcat Phase 1: Deploy to the Canary/Phase 1 Dev Servers
# ---------------------------------------------------------
tomcat-dev-phase-1:
  stage: itc-deploy-phase-1
  extends: .awx-runner
  script:
    - >
      awx -k --conf.host "$CONTROLLER_HOST" --conf.token "$CONTROLLER_TOKEN"
      job_templates launch "$TOMCAT_UPDATE_JOB_TEMPLATE_NAME"
      --limit "itc-dev-phase1"
      --extra_vars "{\"tomcat_apply\": \"${TOMCAT_APPLY:-false}\"}"
      --monitor
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/integration"'
      changes:
        - "patches/tomcat/**/*"
        - "playbooks/itc-patch-tomcat.yml"

# ---------------------------------------------------------
