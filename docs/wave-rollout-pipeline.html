<title>Wave Rollout Pipeline</title>

<style>
  :root {
    --bg: #eef1f4;
    --card-bg: #ffffff;
    --ink: #1c232b;
    --ink-soft: #566072;
    --border: #d7dde3;
    --accent: #2f6f6a;
    --gate-fill: #e8a33d;
    --gate-border: #8a5a12;
    --mono-bg: #f4f6f8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }
  body {
    min-height: 100vh;
    padding: clamp(20px, 4vw, 56px);
  }
  main {
    max-width: 1280px;
    margin: 0 auto;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(22px, 2.6vw, 30px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .source-note {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    white-space: nowrap;
  }
  .source-note strong {
    color: var(--ink);
    font-weight: 500;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 20px 0 28px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .swatch.gate { background: var(--gate-fill); border: 1.5px solid var(--gate-border); }
  .swatch.node { background: #ECECFF; border: 1.5px solid #9370DB; }
  .swatch.skip { background: none; border: 1.5px dashed #888; }
  .diagram-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: clamp(16px, 3vw, 36px);
    overflow-x: auto;
    box-shadow: 0 1px 2px rgba(28, 35, 43, 0.04);
  }
  .diagram-card svg {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }
  footer {
    margin-top: 20px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  footer a { color: var(--accent); }
</style>
</head>
