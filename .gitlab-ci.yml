workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - lint
  - dev
  - preprod
  - prod

# ================= LINT =================
lint:
  stage: lint
  image: cytopia/ansible-lint:latest
  script:
    - yamllint .
    - ansible-lint site.yml

# ---- Shared template: the only place the actual task logic lives ----
# Requires ENVIRONMENT, PHASE, WAVE. Targets inventory group
# <ENVIRONMENT>_<PHASE>_<WAVE>. If that group has no hosts, the job
# exits 0 without running Ansible (see CLAUDE.md: Wave rollout).
.deploy-template:
  image: cytopia/ansible:latest
  before_script:
    - ansible --version
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H $(ansible-inventory -i inventory/${ENVIRONMENT}/hosts.yml --list | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(d['_meta']['hostvars'].keys()))") >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      GROUP="${ENVIRONMENT}_${PHASE}_${WAVE}"
      COUNT=$(ansible-inventory -i inventory/${ENVIRONMENT}/hosts.yml --list | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('$GROUP',{}).get('hosts',[])))")
      if [ "$COUNT" -eq 0 ]; then
        echo "No hosts in $GROUP - nothing to do for this wave."
        exit 0
      fi
      ansible-playbook -i inventory/${ENVIRONMENT}/hosts.yml site.yml --limit "$GROUP"

# ================= DEV =================
dev:db:canary:
  extends: .deploy-template
  stage: dev
  rules:
    - when: manual
  variables: { ENVIRONMENT: dev, PHASE: db, WAVE: canary }
  environment: dev

dev:db:wave2:
  extends: .deploy-template
  stage: dev
  needs: ["dev:db:canary"]
  rules:
    - when: manual
  variables: { ENVIRONMENT: dev, PHASE: db, WAVE: wave2 }
  environment: dev

