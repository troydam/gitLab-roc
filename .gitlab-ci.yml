workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - lint
  - dev
  - preprod
  - prod

# ================= LINT =================
lint:
  stage: lint
  image: cytopia/ansible-lint:latest
  script:
    - yamllint .
    - ansible-lint site.yml

# ---- Shared template: the only place the actual task logic lives ----
.deploy-template:
  image: cytopia/ansible:latest
  before_script:
    - ansible --version
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H $(ansible-inventory -i inventory/${ENVIRONMENT}/hosts.yml --list | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(d['_meta']['hostvars'].keys()))") >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - ansible-playbook -i inventory/${ENVIRONMENT}/hosts.yml site.yml --limit ${ENVIRONMENT}_${PHASE}

# ================= DEV =================
deploy-dev-db:
  extends: .deploy-template
  stage: dev
  variables: { ENVIRONMENT: dev, PHASE: db }
  environment: dev

deploy-dev-app:
  extends: .deploy-template
  stage: dev
  needs: ["deploy-dev-db"]
  variables: { ENVIRONMENT: dev, PHASE: app }
  environment: dev

deploy-dev-web:
  extends: .deploy-template
  stage: dev
  needs: ["deploy-dev-app"]
  variables: { ENVIRONMENT: dev, PHASE: web }
  environment: dev

# ================= PREPROD =================
deploy-preprod-db:
  extends: .deploy-template
  stage: preprod
  needs: ["deploy-dev-web"]        # gates on ALL of dev completing
  variables: { ENVIRONMENT: preprod, PHASE: db }
  environment: preprod
  rules:
    - when: manual                  # human gate to promote dev -> preprod

deploy-preprod-app:
  extends: .deploy-template
  stage: preprod
  needs: ["deploy-preprod-db"]
  variables: { ENVIRONMENT: preprod, PHASE: app }
  environment: preprod

deploy-preprod-web:
  extends: .deploy-template
  stage: preprod
  needs: ["deploy-preprod-app"]
  variables: { ENVIRONMENT: preprod, PHASE: web }
  environment: preprod

# ================= PROD =================
deploy-prod-db:
  extends: .deploy-template
  stage: prod
  needs: ["deploy-preprod-web"]     # gates on ALL of preprod completing
  variables: { ENVIRONMENT: prod, PHASE: db }
  environment: production
  rules:
    - when: manual                  # human gate to promote preprod -> prod

deploy-prod-app:
  extends: .deploy-template
  stage: prod
  needs: ["deploy-prod-db"]
  variables: { ENVIRONMENT: prod, PHASE: app }
  environment: production

deploy-prod-web:
  extends: .deploy-template
  stage: prod
  needs: ["deploy-prod-app"]
  variables: { ENVIRONMENT: prod, PHASE: web }
  environment: production
